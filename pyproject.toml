[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-customer-churn-prediction"
version = "0.1.0"
description = "Leakage-safe telco churn prediction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.15.6"]

[project.scripts]
telco-generate-smoke = "telco_churn.generate_smoke_data:main"
telco-train = "telco_churn.train:main"
telco-evaluate = "telco_churn.evaluate:main"
telco-predict = "telco_churn.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["telco_churn"]
